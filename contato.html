  <!-- Menu dinâmico -->
  <div id="menu"></div>

  <main class="container">
    <h1>Fale Conosco</h1>

    <section class="contato-info">
      <p><strong>Endereço:</strong> <span data-content="contato_endereco">Carregando...</span></p>
      <p><strong>Email:</strong> <span data-content="contato_email">Carregando...</span></p>
      <p><strong>Telefone:</strong> <span data-content="contato_telefone">Carregando...</span></p>
      <p><strong>Horário de Atendimento:</strong> <span data-content="contato_horario">Carregando...</span></p>
    </section>

    <section class="contato-form">
      <h2>Envie sua mensagem</h2>
      <form action="https://formspree.io/f/xblkndze" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="_replyto" required>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
