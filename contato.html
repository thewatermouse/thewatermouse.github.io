  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand"><img src="logo.png" alt="Melinda &amp; Julius" class="brand-logo"></a>
      <button class="hamburger" aria-label="Menu" onclick="this.classList.toggle('open');document.querySelector('.nav-menu').classList.toggle('open')">

<div class="page-header page-header--verde">
  <div class="container">
    <p class="eyebrow">Onde estamos</p>
    <h1>Venha nos <em>visitar</em></h1>
  </div>
</div>

<section class="contato-section">
  <div class="container contato-grid">

    <div class="contato-info reveal">
      <!-- SHEETS: endereço/tel gerenciados pela planilha -->
      <div id="content"></div>

      <div class="info-bloco">
        <h4>Horários</h4>
        <div class="horarios">
          <div class="h-row"><span>Segunda a Sexta</span><span>9h – 19h</span></div>
          <div class="h-row"><span>Sábado</span><span>9h – 17h</span></div>
          <div class="h-row h-row--fechado"><span>Domingo</span><span>Fechado</span></div>
        </div>
      </div>

      <div class="info-bloco">
        <h4>Redes Sociais</h4>
        <div class="social-row">
          <a href="https://instagram.com/melindaejulius" target="_blank" class="social-link">Instagram</a>
          <a href="https://wa.me/5511000000000" target="_blank" class="social-link social-link--wa">WhatsApp</a>
        </div>
      </div>
    </div>

    <div class="contato-direita reveal">
      <div class="map-frame">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.527!2d-46.720!3d-23.595!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjPCsDM1JzQyLjAiUyA0NsKwNDMnMTIuMCJX!5e0!3m2!1spt!2sbr!4v1000000000000!5m2!1spt!2sbr"
          allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Localização Melinda &amp; Julius">
        </iframe>
      </div>

      <div class="form-wrapper">
        <h3>Envie uma mensagem</h3>
        <form action="https://formspree.io/f/xblkndze" method="POST">
          <label>Nome<input type="text" name="nome" required placeholder="Seu nome"></label>
          <label>Email<input type="email" name="_replyto" required placeholder="seu@email.com"></label>
          <label>Mensagem<textarea name="mensagem" rows="4" required placeholder="Como podemos ajudar?"></textarea></label>
          <button type="submit">Enviar mensagem</button>
        </form>
      </div>
    </div>

  </div>
</section>

  <footer class="site-footer">

      <img src="logo.png" alt="Melinda &amp; Julius" class="footer-logo">

        <a href="contato.html">Contato</a>
      </div>
    </div>
  </footer>
<script>
  const _obs = new IntersectionObserver((entries)=>{
    entries.forEach((e,i)=>{ if(e.isIntersecting){ setTimeout(()=>e.target.classList.add('visible'),i*80); _obs.unobserve(e.target); } });
  },{threshold:0.08,rootMargin:'0px 0px -50px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>_obs.observe(el));
  const _nav=document.querySelector('.site-header');
  window.addEventListener('scroll',()=>{ _nav.style.boxShadow=window.scrollY>20?'0 2px 30px rgba(45,74,46,0.12)':'none'; });
</script>
