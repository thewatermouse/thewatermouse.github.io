<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melinda & Julius | Cardápio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Melinda & Julius</h1>
  </header>

  <div id="menu-placeholder"></div>

  <section>
    <h2>Cardápio</h2>
    <p>Confira nossas opções de pratos veganos, vegetarianos e naturais:</p>
    <ul>
      <li>Salada de quinoa com legumes orgânicos</li>
      <li>Hambúrguer vegano artesanal</li>
      <li>Sopa detox do dia</li>
      <li>Suco verde detox</li>
    </ul>
  </section>

  <footer>
    <p>© 2025 Melinda & Julius</p>
  </footer>

  <script>
    fetch('menu.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('menu-placeholder').innerHTML = data;
        const links = document.querySelectorAll('#menu-placeholder a');
        links.forEach(link => {
          if (link.getAttribute('href') === location.pathname.split("/").pop()) {
            link.classList.add('active');
          }
        });
      });
  </script>
</body>
</html>
