<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melinda & Julius | Início</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Melinda & Julius</h1>
    <p>Empório & Restaurante de Produtos Naturais</p>
  </header>

  <!-- Menu externo -->
  <div id="menu-placeholder"></div>

  <section>
    <h2>Bem-vindo!</h2>
    <p>Alimentação saudável, saborosa e consciente. 🌱</p>
  </section>

  <section>
    <h2>Instagram</h2>
    <p>Veja nossas últimas fotos:</p>

    <!-- Widget do Instagram -->
    <iframe src="https://lightwidget.com/widgets/SEU_WIDGET_ID.html" 
            scrolling="no" allowtransparency="true" class="lightwidget-widget" 
            style="width:100%;border:0;overflow:hidden;"></iframe>
  </section>

  <footer>
    <p>© 2025 Melinda & Julius</p>
  </footer>

  <!-- Script para carregar menu externo + destacar página atual -->
  <script>
    fetch('menu.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('menu-placeholder').innerHTML = data;

        // Destacar link ativo automaticamente
        const links = document.querySelectorAll('#menu-placeholder a');
        links.forEach(link => {
          if (link.getAttribute('href') === location.pathname.split("/").pop() || 
              (link.getAttribute('href') === "index.html" && location.pathname.split("/").pop() === "")) {
            link.classList.add('active');
          }
        });
      });
  </script>
</body>
</html>
