<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melinda & Julius | Empório</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Melinda & Julius</h1>
  </header>

  <div id="menu-placeholder"></div>

  <section>
    <h2>Empório</h2>
    <p>Confira nossas categorias de produtos naturais, veganos e orgânicos:</p>

    <h3>Snacks e Petiscos</h3>
    <div class="produtos">
      <div class="produto">
        <img src="imagens/snack1.jpg" alt="Snack 1">
        <p>Mix de castanhas orgânicas</p>
      </div>
      <div class="produto">
        <img src="imagens/snack2.jpg" alt="Snack 2">
        <p>Chips de batata-doce</p>
      </div>
    </div>

    <h3>Bebidas Naturais</h3>
    <div class="produtos">
      <div class="produto">
        <img src="imagens/bebida1.jpg" alt="Bebida 1">
        <p>Suco verde detox</p>
      </div>
      <div class="produto">
        <img src="imagens/bebida2.jpg" alt="Bebida 2">
        <p>Kombucha artesanal</p>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Melinda & Julius</p>
  </footer>

  <script>
    fetch('menu.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('menu-placeholder').innerHTML = data;
        const links = document.querySelectorAll('#menu-placeholder a');
        links.forEach(link => {
          if (link.getAttribute('href') === location.pathname.split("/").pop()) {
            link.classList.add('active');
          }
        });
      });
  </script>
</body>
</html>
