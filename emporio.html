<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melinda & Julius | Empório</title>
<link rel="stylesheet" href="style.css">

<script>
  (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-XXXX');
</script>
</head>
<body>
<noscript>
  <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXX"
          height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>

<header>
  <h1>Melinda & Julius</h1>
</header>

<div id="menu-placeholder"></div>

<section>
  <h2>Empório</h2>
  <div class="produtos"></div>
</section>

<footer>
  <p>© 2025 Melinda & Julius</p>
</footer>

<script>
  fetch('menu.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('menu-placeholder').innerHTML = data;
      document.querySelectorAll('#menu-placeholder a').forEach(link => {
        if(link.getAttribute('href') === location.pathname.split("/").pop()) {
          link.classList.add('active');
        }
      });
    });

  // --- Google Sheets para produtos ---
  fetch('https://docs.google.com/spreadsheets/d/15nxHrFuoDs5yw9wQK43kh3BhCCsg0cPUtfk6pesCRJc/pub?output=csv')
    .then(res => res.text())
    .then(data => {
      const linhas = data.split('\n').slice(1);
      const container = document.querySelector('.produtos');
      linhas.forEach(linha => {
        const [categoria, nome, descricao, imagem] = linha.split(',');
        const div = document.createElement('div');
        div.className = 'produto';
        div.innerHTML = `<img src="imagens/${imagem}" alt="${nome}"><p>${nome}</p><p>${descricao}</p>`;
        container.appendChild(div);
      });
    });
</script>
</body>
</html>
