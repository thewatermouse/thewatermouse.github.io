<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melinda & Julius | Sobre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Melinda & Julius</h1>
  </header>

  <div id="menu-placeholder"></div>

  <section>
    <h2>Sobre Nós</h2>
    <p>Somos um empório e restaurante focado em produtos naturais, veganos, vegetarianos e sem glúten. 🌱</p>
    <p>Nosso objetivo é oferecer alimentos saudáveis com sabor e qualidade para todos.</p>
  </section>

  <footer>
    <p>© 2025 Melinda & Julius</p>
  </footer>

  <script>
    fetch('menu.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('menu-placeholder').innerHTML = data;
        const links = document.querySelectorAll('#menu-placeholder a');
        links.forEach(link => {
          if (link.getAttribute('href') === location.pathname.split("/").pop()) {
            link.classList.add('active');
          }
        });
      });
  </script>
</body>
</html>
